[run]
command:/usr/local/opnsense/scripts/policyanalyzer/incidents/cli.py run
parameters:
type:script_output
message:policy analyzer: incidents correlation run (every 5 minutes)
description:Policy Analyzer incidents correlation

[status]
command:/usr/local/opnsense/scripts/policyanalyzer/incidents/cli.py status
parameters:
type:script_output
message:policy analyzer: incidents status

[summary]
command:/usr/local/opnsense/scripts/policyanalyzer/incidents/cli.py summary
parameters:
type:script_output
message:policy analyzer: incidents summary

[list]
command:/usr/local/opnsense/scripts/policyanalyzer/incidents/cli.py list
parameters:%s %s %s
type:script_output
message:policy analyzer: list incident cases

[case]
command:/usr/local/opnsense/scripts/policyanalyzer/incidents/cli.py case
parameters:%s
type:script_output
message:policy analyzer: incident case %s

[summarize]
command:/usr/local/opnsense/scripts/policyanalyzer/incidents/cli.py summarize
parameters:%s %s %s
type:script_output
message:policy analyzer: AI summary of incident case %s

[digest]
command:/usr/local/opnsense/scripts/policyanalyzer/incidents/cli.py digest
parameters:%s %s %s
type:script_output
message:policy analyzer: incidents daily digest %s

[plan]
command:/usr/local/opnsense/scripts/policyanalyzer/incidents/cli.py plan
parameters:%s %s %s %s
type:script_output
message:policy analyzer: simulate incidents change %s

[apply]
command:/usr/local/opnsense/scripts/policyanalyzer/incidents/cli.py apply
parameters:%s %s %s %s
type:script_output
message:policy analyzer: apply incidents change %s
