[run]
command:/usr/local/opnsense/scripts/policyanalyzer/collect/cli.py run
parameters:%s
type:script_output
message:policy analyzer collect: run the %s collector
description:Policy Analyzer local collector (config history, health, blocks and DNS)

[status]
command:/usr/local/opnsense/scripts/policyanalyzer/collect/cli.py status
parameters:
type:script_output
message:policy analyzer collect: status

[query]
command:/usr/local/opnsense/scripts/policyanalyzer/collect/cli.py query
parameters:%s %s %s %s %s %s %s
type:script_output
message:policy analyzer collect: query %s

[import]
command:/usr/local/opnsense/scripts/policyanalyzer/collect/cli.py import
parameters:%s %s
type:script_output
message:policy analyzer collect: import %s (%s)

[import_undo]
command:/usr/local/opnsense/scripts/policyanalyzer/collect/cli.py import_undo
parameters:%s
type:script_output
message:policy analyzer collect: undo import %s

[schedule]
command:/usr/local/opnsense/scripts/policyanalyzer/collect/cli.py schedule
parameters:%s %s
type:script_output
message:policy analyzer collect: %s schedule %s

[settings]
command:/usr/local/opnsense/scripts/policyanalyzer/collect/cli.py settings
parameters:%s %s
type:script_output
message:policy analyzer collect: settings %s

[revert]
command:/usr/local/opnsense/scripts/policyanalyzer/collect/cli.py revert
parameters:%s %s
type:script_output
message:policy analyzer collect: %s revert %s

[maintain]
command:/usr/local/opnsense/scripts/policyanalyzer/collect/cli.py maintain
parameters:%s
type:script_output
message:policy analyzer collect: maintenance of %s
