[run]
command:/usr/bin/nice -n 20 /usr/local/opnsense/scripts/policyanalyzer/anomalies/cli.py run
parameters:
type:script_output
message:policy analyzer: anomaly detection run (every 15 minutes)
description:Policy Analyzer anomaly detection (LAN NDR)

[summary]
command:/usr/local/opnsense/scripts/policyanalyzer/anomalies/cli.py summary
parameters:
type:script_output
message:policy analyzer: anomaly summary

[status]
command:/usr/local/opnsense/scripts/policyanalyzer/anomalies/cli.py status
parameters:
type:script_output
message:policy analyzer: anomaly detection status

[list]
command:/usr/local/opnsense/scripts/policyanalyzer/anomalies/cli.py list
parameters:%s %s %s
type:script_output
message:policy analyzer: list anomaly findings

[finding]
command:/usr/local/opnsense/scripts/policyanalyzer/anomalies/cli.py finding
parameters:%s
type:script_output
message:policy analyzer: anomaly finding %s

[host]
command:/usr/local/opnsense/scripts/policyanalyzer/anomalies/cli.py host
parameters:%s
type:script_output
message:policy analyzer: anomaly host profile %s

[explain]
command:/usr/local/opnsense/scripts/policyanalyzer/anomalies/cli.py explain
parameters:%s %s %s %s
type:script_output
message:policy analyzer: explain anomaly %s %s

[index]
command:/usr/bin/nice -n 20 /usr/local/opnsense/scripts/policyanalyzer/anomalies/cli.py index
parameters:
type:script_output
message:policy analyzer: build the country/ASN index of the anomaly detection

[plan]
command:/usr/local/opnsense/scripts/policyanalyzer/anomalies/cli.py plan
parameters:%s %s %s %s
type:script_output
message:policy analyzer: simulate anomaly change %s

[apply]
command:/usr/local/opnsense/scripts/policyanalyzer/anomalies/cli.py apply
parameters:%s %s %s %s
type:script_output
message:policy analyzer: apply anomaly change %s
