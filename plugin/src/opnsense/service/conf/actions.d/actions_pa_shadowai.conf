[run]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/policyanalyzer/shadowai/cli.py run
parameters:%s
type:script_output
message:build the AI usage report (%s days)
description:Policy Analyzer AI usage report (shadow AI)

[last]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/policyanalyzer/shadowai/cli.py last
parameters:%s
type:script_output
message:read the AI usage report (%s days)

[summary]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/policyanalyzer/shadowai/cli.py summary
parameters:
type:script_output
message:read the AI usage summary

[catalog]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/policyanalyzer/shadowai/cli.py catalog
parameters:
type:script_output
message:list the AI service catalogue

[propose]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/policyanalyzer/shadowai/cli.py propose
parameters:%s
type:script_output
message:simulate an AI service blocking proposal

[explain]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/policyanalyzer/shadowai/cli.py explain
parameters:%s %s %s
type:script_output
message:explain the AI usage
