[run]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/policyanalyzer/posture/cli.py run
parameters:
type:script_output
message:run the Policy Analyzer posture health check
description:Policy Analyzer posture health check (score history)

[last]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/policyanalyzer/posture/cli.py last
parameters:
type:script_output
message:read the last posture health check

[summary]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/policyanalyzer/posture/cli.py summary
parameters:
type:script_output
message:read the posture summary

[history]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/policyanalyzer/posture/cli.py history
parameters:%s
type:script_output
message:read the posture score history (%s days)

[checks]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/policyanalyzer/posture/cli.py checks
parameters:
type:script_output
message:list the posture checks
cache_ttl:3600

[explain]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/policyanalyzer/posture/cli.py explain
parameters:%s %s %s
type:script_output
message:explain posture check %s
